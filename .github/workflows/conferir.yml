# Confere a publicação depois do envio (manual pelo FileZilla ou por FTP).
# Actions → "Conferir publicação" → Run workflow.
name: Conferir publicação

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Testar e publicar]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  # Um envio para a main só TESTA (a etapa "publicar" fica pulada sem PUBLICAR_AUTOMATICO).
  # Conferir nesse caso acusaria erro à toa: o servidor ainda tem a versão anterior.
  houve-publicacao:
    if: >-
      vars.URL_APP != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && vars.ENVIO_FTP == 'sim'))
    runs-on: ubuntu-24.04
    outputs:
      sim: ${{ steps.ver.outputs.sim }}
    steps:
      - id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "sim=sim" >> "$GITHUB_OUTPUT"; exit 0; fi
          r=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs" --jq '.jobs[] | select(.name == "publicar") | .conclusion')
          echo "Etapa publicar: ${r:-não existe}"
          if [ "$r" = "success" ]; then echo "sim=sim" >> "$GITHUB_OUTPUT"
          else echo "::notice title=Nada publicado::Este envio só foi testado. Para publicar: Actions → Testar e publicar → Run workflow."; fi

  conferir:
    needs: houve-publicacao
    if: needs.houve-publicacao.outputs.sim == 'sim'
    runs-on: ubuntu-24.04
    steps:
      - name: API respondendo
        run: |
          : > /tmp/resumo.txt
          for u in '/api/index.php?r=/saude' /api/v1/saude /api/privado.php /; do
            linha=$(curl -sS -o /tmp/r.txt -w "$u → HTTP %{http_code} %{content_type}" "${{ vars.URL_APP }}$u" 2>&1 || true)
            corpo=$(head -c 160 /tmp/r.txt | tr -d '\r' | tr '\n' ' ')
            echo "$linha | $corpo" | tee -a /tmp/resumo.txt
          done
          echo "::notice title=Resposta da API::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' /tmp/resumo.txt)"
          curl -fsS "${{ vars.URL_APP }}/api/index.php?r=/saude"
          echo
      - name: App abrindo
        run: |
          curl -fsS -o /dev/null -w 'index.html → HTTP %{http_code}\n' "${{ vars.URL_APP }}/"
          curl -fsSL -o /tmp/admin.html -w 'admin/ → HTTP %{http_code}\n' "${{ vars.URL_APP }}/admin/"
          if ! grep -q 'Painel de administração' /tmp/admin.html; then
            if grep -q '<title>Ahvita Cuidados</title>' /tmp/admin.html; then
              echo "::error title=Painel /admin::/admin/ abriu o app, não o painel: a pasta www/admin/ não está no servidor. Publique (Actions → Testar e publicar → Run workflow) ou envie a pasta admin pelo FileZilla."
            else
              echo "::error title=Painel /admin::/admin/ não abriu a página do painel (resposta inesperada)."
            fi
            exit 1
          fi
      - name: Pasta privada bloqueada
        if: (vars.PASTA_PRIVADA_DENTRO_DA_WWW == 'sim' || vars.KINGHOST_PRIVADO_NA_AREA_PUBLICA == 'sim')
        env:
          W: ${{ vars.KINGHOST_PASTA_WWW }}
          PV: ${{ vars.KINGHOST_PASTA_PRIVADO }}
        run: |
          rel() { local x="${1#/}"; x="${x%/}"; echo "$x/"; }
          W=$(rel "$W"); PV=$(rel "$PV"); sub="${PV#"$W"}"
          base="${{ vars.URL_APP }}/${sub}"
          # Arquivos .php: o servidor executa (não mostra o código). Exposto = aparece código ou senha.
          for arq in config/configuracao.php config/configuracao.exemplo.php src/bootstrap.php bin/demo.php; do
            codigo=$(curl -s -o /tmp/c.txt -w '%{http_code}' "$base$arq")
            echo "/${sub}${arq} → HTTP $codigo, $(wc -c < /tmp/c.txt) bytes"
            if grep -qiE '<\?php|senha|segredo|password' /tmp/c.txt; then
              echo "::error title=Pasta privada exposta::/${sub}${arq} mostrou conteúdo. Apague a pasta _privado do servidor e fale com o suporte."
              exit 1
            fi
          done
          # Arquivos comuns (ex.: o esquema do banco): sob nginx o .htaccess não vale.
          codigo=$(curl -s -o /dev/null -w '%{http_code}' "${base}db/001_schema.sql")
          if [ "$codigo" = "200" ]; then
            echo "::warning title=Pasta privada visível::/${sub}db/001_schema.sql abre pela web (servidor ignora .htaccess). Fotos e áudios estão protegidos, mas a pasta privada precisa sair da área pública antes de dados reais."
          fi
