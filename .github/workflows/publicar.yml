# Testa e publica na KingHost a cada envio para a branch main.
# Segredos (Settings → Secrets and variables → Actions → Secrets):
#   FTP_SERVIDOR, FTP_USUARIO, FTP_SENHA
# Variáveis (mesma tela → aba Variables):
#   KINGHOST_PASTA_WWW      pasta pública, a partir da raiz da conta (ex.: /www/)
#   FTP_ABRE_EM             onde o FTP abre ao conectar (ex.: /www/). Padrão: /
#                           Na KingHost o FTP abre na www, mas deixa subir com "..".
#   KINGHOST_PASTA_PRIVADO  ex.: /cuidados_privado/ (de preferência fora da pública)
#   PASTA_PRIVADA_DENTRO_DA_WWW  sim = você aceita que a pasta privada fique DENTRO da www
#                           (necessário quando o FTP já abre dentro da www, como na KingHost)
#   URL_APP                 ex.: https://cuidados.ahvita.com
#   ENVIO_FTP               opcional: sim = envia por FTP. Sem ela, só gera o
#                           pacote para envio manual (Artifacts → FileZilla)
#   FTP_PROTOCOLO           opcional: ftps (padrão) ou ftp
#   PUBLICAR_AUTOMATICO     opcional: sim = publica a cada envio para a main
# Sem PUBLICAR_AUTOMATICO, um envio só TESTA; publicar exige clicar em
# Actions → "Testar e publicar" → Run workflow (vale como aprovação manual).
# Enquanto KINGHOST_PASTA_WWW não existir, o fluxo nunca publica.
name: Testar e publicar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testes:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: raiz
          MARIADB_DATABASE: cuidados
          MARIADB_USER: cuidados
          MARIADB_PASSWORD: cuidados
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CUIDADOS_CONFIG: /nao-existe
      AMBIENTE: teste
      DB_HOST: 127.0.0.1
      DB_NOME: cuidados
      DB_USUARIO: cuidados
      DB_SENHA: cuidados
      CODIGO_CANAIS: log,email
      CODIGO_TESTE_FIXO: '123456'
      MIDIAS_PASTA: ${{ github.workspace }}/midias-teste
      # "Entrar com Google" nos testes: chaves geradas pelo próprio teste (sem internet)
      GOOGLE_CLIENT_ID: teste-ci.apps.googleusercontent.com
      GOOGLE_CERTIFICADOS_ARQUIVO: ${{ github.workspace }}/google-certs-teste.json
      # Painel /admin nos testes: este e-mail entra como dono(a)
      ADMIN_DONOS: dono@ahvita.com
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_mysql, curl, fileinfo, mbstring
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Sintaxe PHP
        run: find api -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Banco
        run: php api/bin/instalar.php
      - name: Teste de ponta a ponta da API
        run: |
          (cd api && php -S 127.0.0.1:8099 dev-router.php > /tmp/servidor.log 2>&1 &)
          # Segundo servidor, mesmo banco, sem envio de código por celular (como a produção sem Twilio)
          (cd api && CODIGO_CANAIS=email php -S 127.0.0.1:8098 dev-router.php > /tmp/servidor2.log 2>&1 &)
          sleep 2
          php api/tests/fluxo.php http://127.0.0.1:8099
          php api/tests/admin.php http://127.0.0.1:8099
          php api/tests/rede.php http://127.0.0.1:8099
          SEM_CELULAR_URL=http://127.0.0.1:8098 php api/tests/conta.php http://127.0.0.1:8099
          php api/tests/clientes.php http://127.0.0.1:8099
          php api/tests/convites.php http://127.0.0.1:8099
          # De novo, com banco limpo, sem reescrita de URL (como no nginx da KingHost)
          mysql -h127.0.0.1 -uroot -praiz -e "DROP DATABASE cuidados; CREATE DATABASE cuidados CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; GRANT ALL ON cuidados.* TO 'cuidados'@'%';"
          php api/bin/instalar.php
          php api/tests/fluxo.php http://127.0.0.1:8099 r
          php api/tests/admin.php http://127.0.0.1:8099 r
          php api/tests/rede.php http://127.0.0.1:8099 r
          SEM_CELULAR_URL=http://127.0.0.1:8098 php api/tests/conta.php http://127.0.0.1:8099 r
          php api/tests/clientes.php http://127.0.0.1:8099 r
          php api/tests/convites.php http://127.0.0.1:8099 r
          php api/bin/auditoria.php
      - name: Vocabulário, tipos e build do app
        run: |
          npm ci
          npm run build

  publicar:
    needs: testes
    if: >-
      github.ref == 'refs/heads/main' && vars.KINGHOST_PASTA_WWW != '' &&
      (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.PUBLICAR_AUTOMATICO == 'sim'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Montar pacote
        env:
          KINGHOST_PASTA_WWW: ${{ vars.KINGHOST_PASTA_WWW }}
          KINGHOST_PASTA_PRIVADO: ${{ vars.KINGHOST_PASTA_PRIVADO }}
          PASTA_PRIVADA_DENTRO_DA_WWW: ${{ vars.PASTA_PRIVADA_DENTRO_DA_WWW || vars.KINGHOST_PRIVADO_NA_AREA_PUBLICA }}
          URL_APP: ${{ vars.URL_APP }}
        run: |
          npm ci
          npm run pacote:kinghost
      - name: Normalizar pastas (o FTP da KingHost só aceita caminhos relativos)
        id: pastas
        env:
          W: ${{ vars.KINGHOST_PASTA_WWW }}
          PV: ${{ vars.KINGHOST_PASTA_PRIVADO }}
          A: ${{ vars.FTP_ABRE_EM || '/' }}
        run: |
          # Caminhos a partir da raiz da conta. FTP_ABRE_EM = onde o FTP abre (ex.: /www/).
          node -e '
            const p = require("path").posix, e = process.env;
            const abs = (x) => p.resolve("/", x || "/");
            const rel = (de, para) => { const r = p.relative(abs(de), abs(para)); return r ? r + "/" : "./"; };
            const www = rel("/", e.W), privado = rel("/", e.PV), raiz = rel(e.A, "/");
            const dentro = abs(e.PV).startsWith(abs(e.W) === "/" ? "/" : abs(e.W) + "/");
            const out = [`www=${www}`, `privado=${privado}`, `raiz=${raiz}`, `dentro=${dentro ? "sim" : ""}`];
            require("fs").appendFileSync(e.GITHUB_OUTPUT, out.join("\n") + "\n");
            console.log(`Pasta pública (desde a raiz da conta): ${www}`);
            console.log(`Pasta privada (desde a raiz da conta): ${privado}${dentro ? "  ← DENTRO da pública" : ""}`);
            console.log(`O FTP abre em ${abs(e.A)}; raiz da conta a partir dali: ${raiz}`);
          '
      - name: Montar pasta para envio manual (espelha o FTP)
        env:
          W: ${{ steps.pastas.outputs.www }}
          PV: ${{ steps.pastas.outputs.privado }}
        run: |
          rm -rf envio && mkdir -p "envio/$W"
          cp -a pacote-kinghost/www/. "envio/$W"
          mkdir -p "envio/$PV"
          cp -a pacote-kinghost/privado/. "envio/$PV"
          rm -f "envio/${PV}config/configuracao.php"
          # midias/ vai só com o .htaccess (nunca apaga fotos e áudios do servidor)
          cat > envio/COMO-ENVIAR.txt <<TXT
          Ahvita Cuidados - versão ${GITHUB_SHA::7}

          1. Descompacte este arquivo no seu computador.
          2. Abra o FileZilla e conecte na KingHost.
          3. Arraste as pastas daqui (${W%/} e ${PV%/}) para a pasta
             inicial do FTP (a que mostra a pasta ${W%/}).
             Quando perguntar sobre arquivos existentes, escolha
             "Sobrescrever" e marque "Sempre usar esta ação".
          4. NÃO apague no servidor: ${PV}config/configuracao.php
             nem ${PV}midias/ (fotos e áudios das pessoas).
          5. Depois, no GitHub: Actions → Conferir publicação → Run workflow.
          TXT
          sed -i 's/^          //' envio/COMO-ENVIAR.txt
          find envio -maxdepth 3 | sort | head -40
      - name: Guardar pacote para envio manual
        uses: actions/upload-artifact@v6
        with:
          name: pacote-kinghost-${{ github.run_number }}
          path: envio/
          include-hidden-files: true
          retention-days: 30
      - name: Conferir as pastas no FTP antes de enviar
        if: vars.ENVIO_FTP == 'sim'
        env:
          S: ${{ secrets.FTP_SERVIDOR }}
          U: ${{ secrets.FTP_USUARIO }}
          P: ${{ secrets.FTP_SENHA }}
          PROTO: ${{ vars.FTP_PROTOCOLO || 'ftps' }}
          W: ${{ steps.pastas.outputs.www }}
          PV: ${{ steps.pastas.outputs.privado }}
          R: ${{ steps.pastas.outputs.raiz }}
        run: |
          mkdir -p /tmp/diag && cd /tmp/diag && npm init -y >/dev/null && npm install --no-audit --no-fund basic-ftp@5.2.2 >/dev/null
          NODE_PATH=/tmp/diag/node_modules node "$GITHUB_WORKSPACE/scripts/conferir-pastas-ftp.cjs"
          sleep 45   # a KingHost recusa uma nova conexão logo em seguida
      # O pacote espelha a raiz: <www>/… e <pasta privada>/…
      # Um envio só, a partir da raiz da conta. Se a conexão falhar (a KingHost às vezes
      # recusa conexões de vez em quando), tenta de novo: até 3 vezes, esperando 60 e 120 s.
      - name: Enviar app + API (uma conexão, a partir da raiz da conta)
        id: envio1
        if: vars.ENVIO_FTP == 'sim'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        # O GitHub passou a rodar esta ação no Node 24, que tenta IPv6 e IPv4 ao mesmo
        # tempo com prazo de 250 ms e desiste das duas ("AggregateError (control socket)").
        # Aqui: tenta só o endereço IPv4, sem a corrida (o FTP da KingHost demora a responder).
        env:
          NODE_OPTIONS: --no-network-family-autoselection --dns-result-order=ipv4first
        with:
          server: ${{ secrets.FTP_SERVIDOR }}
          username: ${{ secrets.FTP_USUARIO }}
          password: ${{ secrets.FTP_SENHA }}
          protocol: ${{ vars.FTP_PROTOCOLO || 'ftps' }}
          local-dir: ./envio/
          server-dir: ${{ steps.pastas.outputs.raiz }}
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            COMO-ENVIAR.txt
            ${{ steps.pastas.outputs.privado }}midias/**
            ${{ steps.pastas.outputs.privado }}config/configuracao.php
      - name: Esperar antes de tentar de novo
        if: vars.ENVIO_FTP == 'sim' && steps.envio1.outcome == 'failure'
        run: |
          echo "::warning title=Envio por FTP::A 1ª tentativa falhou (o FTP da KingHost recusa conexões de vez em quando); nova tentativa em 60 s."
          sleep 60
      - name: Enviar app + API (2ª tentativa)
        id: envio2
        if: vars.ENVIO_FTP == 'sim' && steps.envio1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        # O GitHub passou a rodar esta ação no Node 24, que tenta IPv6 e IPv4 ao mesmo
        # tempo com prazo de 250 ms e desiste das duas ("AggregateError (control socket)").
        # Aqui: tenta só o endereço IPv4, sem a corrida (o FTP da KingHost demora a responder).
        env:
          NODE_OPTIONS: --no-network-family-autoselection --dns-result-order=ipv4first
        with:
          server: ${{ secrets.FTP_SERVIDOR }}
          username: ${{ secrets.FTP_USUARIO }}
          password: ${{ secrets.FTP_SENHA }}
          protocol: ${{ vars.FTP_PROTOCOLO || 'ftps' }}
          local-dir: ./envio/
          server-dir: ${{ steps.pastas.outputs.raiz }}
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            COMO-ENVIAR.txt
            ${{ steps.pastas.outputs.privado }}midias/**
            ${{ steps.pastas.outputs.privado }}config/configuracao.php
      - name: Esperar mais antes da última tentativa
        if: vars.ENVIO_FTP == 'sim' && steps.envio2.outcome == 'failure'
        run: |
          echo "::warning title=Envio por FTP::A 2ª tentativa falhou; última tentativa em 120 s."
          sleep 120
      - name: Enviar app + API (3ª tentativa)
        if: vars.ENVIO_FTP == 'sim' && steps.envio2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        # O GitHub passou a rodar esta ação no Node 24, que tenta IPv6 e IPv4 ao mesmo
        # tempo com prazo de 250 ms e desiste das duas ("AggregateError (control socket)").
        # Aqui: tenta só o endereço IPv4, sem a corrida (o FTP da KingHost demora a responder).
        env:
          NODE_OPTIONS: --no-network-family-autoselection --dns-result-order=ipv4first
        with:
          server: ${{ secrets.FTP_SERVIDOR }}
          username: ${{ secrets.FTP_USUARIO }}
          password: ${{ secrets.FTP_SENHA }}
          protocol: ${{ vars.FTP_PROTOCOLO || 'ftps' }}
          local-dir: ./envio/
          server-dir: ${{ steps.pastas.outputs.raiz }}
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            COMO-ENVIAR.txt
            ${{ steps.pastas.outputs.privado }}midias/**
            ${{ steps.pastas.outputs.privado }}config/configuracao.php
      - name: Diagnóstico do FTP (só roda se o envio falhar)
        if: failure() && vars.ENVIO_FTP == 'sim'
        env:
          S: ${{ secrets.FTP_SERVIDOR }}
          U: ${{ secrets.FTP_USUARIO }}
          P: ${{ secrets.FTP_SENHA }}
          W: ${{ steps.pastas.outputs.www }}
          PV: ${{ steps.pastas.outputs.privado }}
          PROTO: ${{ vars.FTP_PROTOCOLO || 'ftps' }}
        run: |
          sleep 60
          [ -d /tmp/diag/node_modules/basic-ftp ] || (mkdir -p /tmp/diag && cd /tmp/diag && npm init -y >/dev/null && npm install --no-audit --no-fund basic-ftp@5.2.2 >/dev/null)
          NODE_PATH=/tmp/diag/node_modules node "$GITHUB_WORKSPACE/scripts/diagnostico-ftp.cjs"
